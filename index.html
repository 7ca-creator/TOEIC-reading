function speak(text,locale=accent){
 if(!("speechSynthesis" in window)){alert("此瀏覽器不支援語音播放");return}
 refreshVoices();speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);u.lang=locale;u.rate=.82;
 const exact=voices.find(v=>v.lang.toLowerCase()===locale.toLowerCase());
 if(exact)u.voice=exact;
 else{const fallback=voices.find(v=>v.lang.toLowerCase().startsWith("en"));if(fallback)u.voice=fallback}
 speechSynthesis.speak(u);

}

let currentPage=PAGE_ID,cardBatch=[],cardIndex=0,quizType="meaning",listFilter="all",listSearch="";
const oldSave=save;
function saveProgress(){oldSave();sync()}
function mastery(id){return state.results[id]?.level||"new"}
function nextDue(id){const r=state.results[id];return r?.due?new Date(r.due).getTime():0}
function due(w){return mastery(w.id)!=="new"&&nextDue(w.id)<=Date.now()}
function setLevel(id,level){
 const r=state.results[id]||{correct:0,wrong:0};
 const prev=r.level||"new",now=Date.now(),interval=level==="unknown"?0:level==="fuzzy"?1:prev==="mastered"?Math.min((r.interval||3)*2,30):3;
 r.level=level;r.interval=interval;r.due=new Date(now+(level==="unknown"?10/1440:interval)*86400000).toISOString();r.last=new Date(now).toISOString();
 if(level==="mastered")r.correct++;else if(level==="unknown")r.wrong++;
 state.results[id]=r;saveProgress()
}
function record(id,ok){const r=state.results[id]||{correct:0,wrong:0};r[ok?"correct":"wrong"]++;r.last=new Date().toISOString();state.results[id]=r;saveProgress()}
function pageWords(pageId=currentPage){return words.filter(w=>pageId==="all"||w.pageId===pageId)}
function groupBatch(){
 const groups=UNIT.pairs.map((p,i)=>({i,items:words.filter(w=>w.pageId===currentPage&&w.pair===i)}));
 const score=g=>g.items.some(w=>due(w))?0:g.items.some(w=>mastery(w.id)==="new")?1:g.items.some(w=>mastery(w.id)==="unknown")?2:g.items.some(w=>mastery(w.id)==="fuzzy")?3:4;
 const pending=groups.filter(g=>score(g)<4).sort((a,b)=>score(a)-score(b)||a.i-b.i);
 return (pending.length?pending:groups).slice(0,GROUP_SIZE).flatMap(g=>g.items);
}
function startCards(batch=groupBatch()){cardBatch=batch;cardIndex=0;show=false;mode="cards";render()}

function startGrammar(){quizType="grammar";quiz=GRAMMAR.filter(q=>q[1]!=="implementation").sort(()=>Math.random()-.5).slice(0,10).map(q=>({sentence:q[0],opts:[q[1],q[2]].sort(()=>Math.random()-.5),answer:q[1],translation:q[3]}));qi=0;selected=null;finished=false;session=[];mode="grammar";render()}
const SUPABASE_URL="https://hcogdrrtdxmdccayzxdy.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_44UFaRhUXNbBf_BENBdQTw_LcYIUDhj";
async function initAuth(){
  $("#auth").textContent="登入載入中…";
  $("#auth").disabled=true;
  try{
    const mod=await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
    supabase=mod.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{
      auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
    });
    const {data,error}=await supabase.auth.getSession();
    if(error)throw error;
    user=data.session?.user||null;
    updateAuth();
    supabase.auth.onAuthStateChange((_event,s)=>{
      const previous=user?.id;
      user=s?.user||null;
      updateAuth();
      if(user&&user.id!==previous)setTimeout(()=>pull(),0);
    });
    if(user)await pull();
  }catch(e){
    console.error("Google authentication initialization failed",e);
    $("#auth").disabled=false;
    $("#auth").textContent="登入連線失敗 · 重試";
    $("#auth").onclick=()=>initAuth();
  }
}
function updateAuth(){
  $("#auth").disabled=false;
  $("#auth").textContent=user?"登出":"使用 Google 登入";
  $("#auth").onclick=async()=>{
    if(user){
      const {error}=await supabase.auth.signOut();
      if(error){alert("登出失敗，請重試");return}
      user=null;updateAuth();
    }else{
      const {error}=await supabase.auth.signInWithOAuth({
        provider:"google",
        options:{redirectTo:location.origin+location.pathname}
      });
      if(error)alert("Google 登入失敗："+error.message);
    }
  };
}
async function pull(){if(!user||!supabase)return;const {data,error}=await supabase.from("study_progress").select("payload").eq("user_id",user.id).eq("unit_id",UNIT.id).maybeSingle();if(error){console.warn(error);return}if(data?.payload){for(const [k,r] of Object.entries(data.payload.results||{})){const local=state.results[k];if(!local||((r.last||"")>(local.last||"")))state.results[k]=r}state.sessions=[...new Map([...(data.payload.sessions||[]),...state.sessions].map(x=>[JSON.stringify(x),x])).values()].slice(-100);save()}await sync();render()}
let syncing=false;async function sync(){if(!user||!supabase||syncing)return;syncing=true;try{await supabase.from("study_progress").upsert({user_id:user.id,unit_id:UNIT.id,payload:state,updated_at:new Date().toISOString()},{onConflict:"user_id,unit_id"})}finally{syncing=false}}

function shell(title,body){$("#app").innerHTML='<div class="muted">Grammar Section 4 · Ch10 名詞 · p.134 · 46 組 / 92 個詞彙</div><h1>'+title+'</h1>'+body}
function home(){
 const total=pageWords(),practiced=total.filter(w=>state.results[w.id]).length,dueCount=total.filter(due).length,mastered=total.filter(w=>mastery(w.id)==="mastered").length,fuzzy=total.filter(w=>mastery(w.id)==="fuzzy").length,unknown=total.filter(w=>mastery(w.id)==="unknown").length;
 shell("我的單字題庫",'<p class="muted">依頁碼學習、每次 5 組，並自動安排複習。</p><div class="stats"><div class="stat"><strong>'+PAGES.length+'</strong>頁題庫</div><div class="stat"><strong>'+practiced+'</strong>已練詞彙</div><div class="stat"><strong>'+dueCount+'</strong>待複習</div></div><div class="panel"><span class="tag">Grammar Section 4 · Ch10 名詞 · p.134</span><h2>'+escape(UNIT.title)+'</h2><p class="muted">46 組 / 92 個單字 · 已掌握 '+mastered+' 個 · 模糊 '+fuzzy+' 個 · 不認識 '+unknown+' 個</p><div class="progress"><span style="width:'+Math.round(practiced/total.length*100)+'%"></span></div><div class="actions"><button id="cards">學習 5 組</button><button id="review" class="secondary">間隔複習 ('+dueCount+')</button><button id="grammar" class="outline">TOEIC 文法填空</button><button id="test" class="outline">單字選擇題</button><button id="list" class="outline">完整單字列表</button></div></div><div class="panel"><h2>頁碼管理</h2><p class="muted">目前已建立 p.134。未來新增課本頁面時，可擴充為獨立頁面與跨頁混合測驗。</p><button id="export" class="secondary">匯出學習紀錄 JSON</button></div>');
 $("#cards").onclick=()=>startCards();
 $("#review").onclick=()=>{const dueWords=total.filter(due);if(!dueWords.length){alert("目前沒有到期的複習單字");return}startCards(dueWords.slice(0,10))};
 $("#grammar").onclick=startGrammar;$("#test").onclick=()=>startQuiz(total);
 $("#list").onclick=()=>{mode="list";render()};
 $("#export").onclick=()=>{const blob=new Blob([JSON.stringify({pages:PAGES,progress:state},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="TOEIC-reading-progress.json";a.click();URL.revokeObjectURL(a.href)}
}
function cardView(){
 if(cardIndex>=cardBatch.length){shell("本輪完成",'<div class="panel"><h2>已完成 '+new Set(cardBatch.map(w=>w.pair)).size+' 組 / '+cardBatch.length+' 個單字</h2><p>系統已依照你的自評安排下次複習。</p><div class="actions"><button id="again">再學 5 組</button><button id="home" class="secondary">返回首頁</button></div></div>');$("#again").onclick=()=>startCards();$("#home").onclick=()=>{mode="home";render()};return}
 const w=cardBatch[cardIndex],level=mastery(w.id);
 shell("5 組單字記憶卡",'<p class="muted">'+(cardIndex+1)+' / '+cardBatch.length+' 個單字 · 目前：'+({new:"未學習",unknown:"不認識",fuzzy:"模糊",mastered:"已掌握"}[level])+'</p><div class="progress"><span style="width:'+Math.round((cardIndex+1)/cardBatch.length*100)+'%"></span></div><div class="panel"><div class="cardword">'+escape(w.en)+'</div>'+(show?'<div class="meaning">'+escape(w.zh)+'</div>':'<p class="muted" style="text-align:center">先回想中文意思，再翻牌</p>')+(show?learningExtras(w):'')+'<div class="actions" style="justify-content:center">'+(show?'<button data-level="unknown" class="outline">不認識</button><button data-level="fuzzy" class="secondary">模糊</button><button data-level="mastered">已掌握</button>':'<button id="flip">翻牌看答案</button>')+'</div></div><button id="home" class="secondary">返回首頁</button>');
 if(show)bindLearningExtras(w);$("#home").onclick=()=>{mode="home";render()};
 if(!show)$("#flip").onclick=()=>{show=true;render()};
 else document.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>{setLevel(w.id,b.dataset.level);cardIndex++;show=false;render()});
}
function listView(){
 const query=listSearch.trim().toLowerCase(),filtered=pageWords().filter(w=>(!query||w.en.toLowerCase().includes(query)||w.zh.includes(query))&&(listFilter==="all"||mastery(w.id)===listFilter||(listFilter==="due"&&due(w))));
 shell("p.134 完整單字列表",'<p class="muted">共 46 組、92 個詞彙，可搜尋並查看記憶狀態。</p><div class="panel"><input id="search" placeholder="搜尋英文或中文" value="'+escape(listSearch)+'" style="width:100%;padding:13px;border:1px solid #d8dfe5;border-radius:12px;font:inherit"><div class="actions"><select id="filter" style="padding:10px;border-radius:10px"><option value="all">全部</option><option value="new">未學習</option><option value="unknown">不認識</option><option value="fuzzy">模糊</option><option value="mastered">已掌握</option><option value="due">待複習</option></select></div><div id="list-results">'+listRows(filtered)+'</div></div><button id="home" class="secondary">返回首頁</button>');
 $("#filter").value=listFilter;$("#filter").onchange=e=>{listFilter=e.target.value;render()};
 $("#search").oninput=e=>{listSearch=e.target.value;$("#list-results").innerHTML=listRows(pageWords().filter(w=>(!listSearch||w.en.toLowerCase().includes(listSearch.toLowerCase())||w.zh.includes(listSearch))&&(listFilter==="all"||mastery(w.id)===listFilter||(listFilter==="due"&&due(w)))));bindRows()};
 bindRows();$("#home").onclick=()=>{mode="home";render()}
}
function listRows(arr){return '<p class="muted">顯示 '+arr.length+' 個單字</p>'+arr.map(w=>'<div class="vocab-row"><div><strong>'+escape(w.en)+'</strong><div class="muted">'+escape(w.zh)+' · '+(w.type==="person"?"人物名詞":"事物／抽象名詞")+'</div><div class="muted">'+({new:"未學習",unknown:"不認識",fuzzy:"模糊",mastered:"已掌握"}[mastery(w.id)])+(due(w)?" · 待複習":"")+'</div></div><button data-word="'+escape(w.id)+'" class="secondary">學習</button></div>').join("")}
function bindRows(){document.querySelectorAll("[data-word]").forEach(b=>b.onclick=()=>{const w=words.find(x=>x.id===b.dataset.word);if(w)openWordModal(w)})}
function openWordModal(w){
 let dialog=document.querySelector("#word-dialog");
 if(!dialog){dialog=document.createElement("dialog");dialog.id="word-dialog";dialog.className="word-modal";dialog.setAttribute("aria-label","單字學習說明");document.body.appendChild(dialog)}
 const status={new:"未學習",unknown:"不認識",fuzzy:"模糊",mastered:"已掌握"};
 const pair=UNIT.pairs[w.pair],related=w.type==="person"?pair.abstract:pair.person;
 dialog.innerHTML='<div class="modal-inner"><div class="modal-top"><span class="tag">p.134 · '+escape(w.type==="person"?"人物名詞":"事物／抽象名詞")+'</span><button class="secondary" id="close-modal" aria-label="關閉單字說明">✕</button></div><div class="modal-title">'+escape(w.en)+'</div><p class="modal-meaning">'+escape(w.zh)+'</p><p class="muted modal-related">對照單字：'+escape(related)+' · 記憶程度：<strong id="modal-level">'+status[mastery(w.id)]+'</strong></p>'+learningExtras(w)+'<div class="learn-extra"><strong class="modal-section-title">記憶程度</strong><div class="modal-actions"><button data-modal-level="unknown" class="outline">不認識</button><button data-modal-level="fuzzy" class="secondary">模糊</button><button data-modal-level="mastered">已掌握</button></div></div></div>';
 dialog.querySelector("#close-modal").onclick=()=>dialog.close();
 dialog.onclick=e=>{if(e.target===dialog)dialog.close()};
 dialog.querySelectorAll("[data-modal-level]").forEach(b=>b.onclick=()=>{setLevel(w.id,b.dataset.modalLevel);dialog.querySelector("#modal-level").textContent=status[b.dataset.modalLevel];dialog.querySelectorAll("[data-modal-level]").forEach(btn=>{const active=btn.dataset.modalLevel===b.dataset.modalLevel;btn.setAttribute("aria-pressed",String(active));btn.classList.toggle("chosen",active)});const rows=document.querySelector("#list-results");if(rows){const search=listSearch.trim().toLowerCase();rows.innerHTML=listRows(pageWords().filter(x=>(!search||x.en.toLowerCase().includes(search)||x.zh.includes(search))&&(listFilter==="all"||mastery(x.id)===listFilter||(listFilter==="due"&&due(x)))));bindRows()}});
 dialog.querySelectorAll("[data-modal-level]").forEach(btn=>{const active=btn.dataset.modalLevel===mastery(w.id);btn.setAttribute("aria-pressed",String(active));btn.classList.toggle("chosen",active)});
 bindLearningExtras(w);
 if(!dialog.open)dialog.showModal();
}
function quizView(grammar=false){
 if(finished){const good=session.filter(x=>x.ok).length;shell("測驗完成",'<div class="panel"><h2>答對 '+good+' / '+session.length+' 題</h2><p class="muted">正確率 '+Math.round(100*good/session.length)+'%</p><div class="actions"><button id="again">再測一次</button><button id="home" class="secondary">返回首頁</button></div></div>');$("#again").onclick=()=>grammar?startGrammar():startQuiz(quiz.map(q=>q.word));$("#home").onclick=()=>{mode="home";render()};return}
 const q=quiz[qi],ok=selected!==null&&(grammar?q.opts[selected]===q.answer:selected===q.answer);
 shell(grammar?"TOEIC 文法填空":"單字選擇題",'<p class="muted">第 '+(qi+1)+' / '+quiz.length+' 題</p><div class="progress"><span style="width:'+Math.round(qi/quiz.length*100)+'%"></span></div><div class="panel"><p class="muted">'+(grammar?"請依句意與詞性選出正確答案":"請選出最適合的中文意思")+'</p><div class="'+(grammar?"sentence":"cardword")+'">'+escape(grammar?q.sentence:q.word.en)+'</div><div class="choices">'+q.opts.map((o,i)=>'<button data-choice="'+i+'" class="'+(selected===i?(ok?"correct":"wrong"):"")+'">'+String.fromCharCode(65+i)+'. '+escape(o)+'</button>').join("")+'</div>'+(selected!==null?'<p>'+(ok?"答對了！":"正確答案："+escape(grammar?q.answer:q.word.zh))+'</p>'+(grammar?'<p class="muted">'+escape(q.translation)+'</p>':'')+'<button id="next">'+(qi+1===quiz.length?"查看結果":"下一題")+'</button>'+(grammar?'':learningExtras(q.word)):'')+'</div><button id="home" class="secondary">返回首頁</button>');
 if(selected!==null&&!grammar)bindLearningExtras(q.word);
 $("#home").onclick=()=>{mode="home";render()};
 document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{if(selected!==null)return;selected=Number(b.dataset.choice);const correct=grammar?q.opts[selected]===q.answer:selected===q.answer;if(!grammar)record(q.word.id,correct);session.push({id:grammar?"grammar-"+qi:q.word.id,ok:correct});render()});
 if(selected!==null)$("#next").onclick=()=>{qi++;selected=null;if(qi===quiz.length){finished=true;state.sessions.push({unit:UNIT.id,page:PAGE_ID,kind:grammar?"grammar":"meaning",date:new Date().toISOString(),correct:session.filter(x=>x.ok).length,total:session.length});saveProgress()}render()}
}
function render(){if(mode==="home")home();else if(mode==="cards")cardView();else if(mode==="list")listView();else if(mode==="quiz")quizView(false);else if(mode==="grammar")quizView(true)}
function startQuiz(list){quizType="meaning";const pool=[...list].sort(()=>Math.random()-.5).slice(0,Math.min(10,list.length));quiz=pool.map(w=>{const opts=[w.zh,...words.filter(x=>x.id!==w.id&&x.zh!==w.zh).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.zh)].sort(()=>Math.random()-.5);return{word:w,opts,answer:opts.indexOf(w.zh)}});qi=0;selected=null;finished=false;session=[];mode="quiz";render()}
render();initAuth();
