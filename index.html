<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>TOEIC Reading</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#263347;background:#f5f3ed}*{box-sizing:border-box}body{margin:0}main{max-width:740px;margin:auto;padding:28px 18px 80px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:38px}.brand{font-weight:800;letter-spacing:.1em;font-size:13px}.muted{color:#697687;font-size:13px}h1{font-size:32px;margin:8px 0}h2{font-size:21px}.panel{background:white;border:1px solid #e1e3e3;border-radius:22px;padding:24px;margin:18px 0;box-shadow:0 5px 18px #26334709}.tag{font-size:12px;background:#e8edf1;padding:5px 10px;border-radius:20px}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:#273c55;color:white}button.secondary{background:#edf0f2;color:#263347}button.outline{background:white;color:#263347;border:1px solid #d8dfe5}button:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#edf0f2;padding:14px;border-radius:13px;text-align:center}.stat strong{display:block;font-size:22px}.cardword{font-size:32px;font-weight:750;text-align:center;margin:45px 0 10px}.meaning{text-align:center;font-size:19px;margin:16px}.choices{display:grid;gap:10px;margin-top:24px}.choices button{text-align:left;background:#f0f3f5;color:#263347;border:1px solid #dce1e5}.choices button.correct{background:#dff1e5;border-color:#62a37a}.choices button.wrong{background:#f9e1e1;border-color:#c97b7b}.progress{height:8px;border-radius:10px;background:#e5e9eb;overflow:hidden}.progress span{display:block;height:100%;background:#658da4}footer{margin-top:35px;font-size:12px;color:#697687}@media(max-width:480px){.panel{padding:18px}h1{font-size:27px}.cardword{font-size:27px}}</style></head><body><main><header><div class="brand">TOEIC / READING</div><button id="auth" class="secondary">Google 登入</button></header><div id="app"></div><footer>第 04 單元內容尚待核對 · 課本頁碼待確認。未登入進度僅儲存在本機。</footer></main><script type="module">
const UNIT={"id":"unit-04","unit":"04","page":null,"title":"人物名詞 vs. 事物／抽象名詞","status":"待核對","pairs":[{"id":"04-01","person":"accountant","abstract":"account","personZh":"會計師","abstractZh":"帳戶"},{"id":"04-02","person":"applicant","abstract":"application","personZh":"申請者","abstractZh":"申請"},{"id":"04-03","person":"attendant","abstract":"attendance","personZh":"服務員","abstractZh":"出席"},{"id":"04-04","person":"consultant","abstract":"consultation","personZh":"顧問","abstractZh":"諮詢"},{"id":"04-05","person":"employer","abstract":"employee","personZh":"雇主","abstractZh":"員工"},{"id":"04-06","person":"facilitator","abstract":"facilitation","personZh":"促進者","abstractZh":"促進"},{"id":"04-07","person":"journalist","abstract":"journal","personZh":"記者","abstractZh":"期刊"},{"id":"04-08","person":"occupant","abstract":"occupancy","personZh":"佔有者","abstractZh":"佔有"},{"id":"04-09","person":"producer","abstract":"production","personZh":"生產者","abstractZh":"生產"},{"id":"04-10","person":"receptionist","abstract":"reception","personZh":"接待員","abstractZh":"接待"},{"id":"04-11","person":"recruiter","abstract":"recruitment","personZh":"招募人員","abstractZh":"招募"},{"id":"04-12","person":"analyst","abstract":"analysis","personZh":"分析者","abstractZh":"分析"},{"id":"04-13","person":"architect","abstract":"architecture","personZh":"建築師","abstractZh":"建築"},{"id":"04-14","person":"assembler","abstract":"assembly","personZh":"裝配人員","abstractZh":"組裝"},{"id":"04-15","person":"assistant","abstract":"assistance","personZh":"助理","abstractZh":"協助"},{"id":"04-16","person":"authority","abstract":"authorization","personZh":"權力","abstractZh":"授權"},{"id":"04-17","person":"beneficiary","abstract":"benefit","personZh":"受益者","abstractZh":"利益"},{"id":"04-18","person":"committee","abstract":"commitment","personZh":"委員會","abstractZh":"承諾"},{"id":"04-19","person":"consumer","abstract":"consumption","personZh":"消費者","abstractZh":"消費"},{"id":"04-20","person":"contributor","abstract":"contribution","personZh":"貢獻者","abstractZh":"貢獻"},{"id":"04-21","person":"coordinator","abstract":"coordination","personZh":"協調者","abstractZh":"協調"},{"id":"04-22","person":"correspondent","abstract":"correspondence","personZh":"通訊記者","abstractZh":"通信"},{"id":"04-23","person":"distributor","abstract":"distribution","personZh":"分配者","abstractZh":"分配"},{"id":"04-24","person":"donor","abstract":"donation","personZh":"捐贈者","abstractZh":"捐贈"},{"id":"04-25","person":"editor","abstract":"edition","personZh":"編輯者","abstractZh":"版本"},{"id":"04-26","person":"engineer","abstract":"engineering","personZh":"工程師","abstractZh":"工程"},{"id":"04-27","person":"enthusiast","abstract":"enthusiasm","personZh":"熱衷者","abstractZh":"熱情"},{"id":"04-28","person":"founder","abstract":"foundation","personZh":"創立者","abstractZh":"創立"},{"id":"04-29","person":"inspector","abstract":"inspection","personZh":"檢查者","abstractZh":"檢查"},{"id":"04-30","person":"instructor","abstract":"instruction","personZh":"講師","abstractZh":"教導"},{"id":"04-31","person":"investor","abstract":"investment","personZh":"投資者","abstractZh":"投資"},{"id":"04-32","person":"licensor","abstract":"license","personZh":"授權者","abstractZh":"許可證"},{"id":"04-33","person":"manager","abstract":"management","personZh":"經理","abstractZh":"管理"},{"id":"04-34","person":"manufacturer","abstract":"manufacture","personZh":"製造業者","abstractZh":"製造"},{"id":"04-35","person":"negotiator","abstract":"negotiation","personZh":"協商者","abstractZh":"協商"},{"id":"04-36","person":"operator","abstract":"operation","personZh":"操作員","abstractZh":"操作"},{"id":"04-37","person":"owner","abstract":"ownership","personZh":"擁有者","abstractZh":"所有權"},{"id":"04-38","person":"participant","abstract":"participation","personZh":"參與者","abstractZh":"參與"},{"id":"04-39","person":"performer","abstract":"performance","personZh":"表演者","abstractZh":"表演"},{"id":"04-40","person":"presenter","abstract":"presentation","personZh":"發表者","abstractZh":"簡報"},{"id":"04-41","person":"relative","abstract":"relation","personZh":"親戚","abstractZh":"關係"},{"id":"04-42","person":"representative","abstract":"representation","personZh":"代表者","abstractZh":"代表"},{"id":"04-43","person":"resident","abstract":"residence","personZh":"居民","abstractZh":"居住"},{"id":"04-44","person":"subscriber","abstract":"subscription","personZh":"訂戶","abstractZh":"訂閱"},{"id":"04-45","person":"supervisor","abstract":"supervision","personZh":"監督者","abstractZh":"監督"},{"id":"04-46","person":"technician","abstract":"technology","personZh":"技術人員","abstractZh":"技術"}]},KEY="toeic-reading-progress-v1",CFG="toeic-reading-config-v1";let state=JSON.parse(localStorage.getItem(KEY)||'{"results":{},"sessions":[]}'),mode="home",idx=0,show=false,quiz=[],qi=0,selected=null,finished=false,session=[],supabase=null,user=null;
const $=s=>document.querySelector(s),save=()=>localStorage.setItem(KEY,JSON.stringify(state));const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const words=UNIT.pairs.flatMap(p=>[{id:p.id+"p",en:p.person,zh:p.personZh},{id:p.id+"a",en:p.abstract,zh:p.abstractZh}]);
function record(id,ok){let r=state.results[id]||{correct:0,wrong:0};r[ok?"correct":"wrong"]++;r.last=new Date().toISOString();state.results[id]=r;save();sync()}
async function initAuth(){const c=JSON.parse(localStorage.getItem(CFG)||"null");if(!c?.url||!c?.key){$("#auth").textContent="設定 Google 登入";$("#auth").onclick=setup;return}try{const mod=await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");supabase=mod.createClient(c.url,c.key);const s=await supabase.auth.getSession();user=s.data.session?.user||null;supabase.auth.onAuthStateChange(async(_,s)=>{user=s?.user||null;updateAuth();if(user)await pull()});updateAuth();if(user)await pull()}catch(e){$("#auth").textContent="登入設定";$("#auth").onclick=setup}}
function updateAuth(){$("#auth").textContent=user?"登出":"Google 登入";$("#auth").onclick=async()=>{if(user){await supabase.auth.signOut();user=null;updateAuth()}else await supabase.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}})}}
function setup(){let url=prompt("Supabase Project URL (https://...supabase.co)");if(!url)return;let key=prompt("Supabase publishable / anon key（不可輸入 secret 或 service_role 金鑰）");if(!key)return;localStorage.setItem(CFG,JSON.stringify({url:url.trim(),key:key.trim()}));location.reload()}
async function pull(){if(!user||!supabase)return;const {data,error}=await supabase.from("study_progress").select("payload").eq("user_id",user.id).eq("unit_id",UNIT.id).maybeSingle();if(error){console.warn(error);return}if(data?.payload){for(const [k,r] of Object.entries(data.payload.results||{})){const local=state.results[k];if(!local||((r.last||"")>(local.last||"")))state.results[k]=r}state.sessions=[...(data.payload.sessions||[]),...state.sessions].slice(-100);save()}await sync();render()}
let syncing=false;async function sync(){if(!user||!supabase||syncing)return;syncing=true;try{await supabase.from("study_progress").upsert({user_id:user.id,unit_id:UNIT.id,payload:state,updated_at:new Date().toISOString()},{onConflict:"user_id,unit_id"})}finally{syncing=false}}
function shell(title,body){$("#app").innerHTML='<div class="muted">單元 '+UNIT.unit+' · '+UNIT.pairs.length+' 組 / '+words.length+' 個詞彙</div><h1>'+title+'</h1>'+body}
function render(){if(mode==="home"){let done=Object.keys(state.results).length,wrong=Object.values(state.results).filter(x=>x.wrong>x.correct).length;shell("我的單字題庫",'<p class="muted">每頁獨立學習、獨立紀錄。新增頁面將成為另一份題庫。</p><div class="stats"><div class="stat"><strong>1</strong>單元</div><div class="stat"><strong>'+done+'</strong>已練詞彙</div><div class="stat"><strong>'+wrong+'</strong>待加強</div></div><div class="panel"><span class="tag">第 04 單元 · 待核對</span><h2>'+UNIT.title+'</h2><p class="muted">頁碼待確認 · '+UNIT.pairs.length+' 組單字</p><div class="progress"><span style="width:'+Math.round(done/words.length*100)+'%"></span></div><p class="muted">已練習 '+done+' / '+words.length+' 個詞彙</p><div class="actions"><button id="cards">開始記憶卡</button><button id="test" class="secondary">單元小測驗</button><button id="errors" class="outline">錯題重練</button></div></div><div class="panel"><h2>題庫管理</h2><p class="muted">新增課本頁面請先傳照片到 ChatGPT 核對，再更新本網站題庫。</p><button id="export" class="outline">匯出學習紀錄 JSON</button></div>');$("#cards").onclick=()=>{mode="cards";idx=0;show=false;render()};$("#test").onclick=()=>startQuiz(words);$("#errors").onclick=()=>{const w=words.filter(x=>(state.results[x.id]?.wrong||0)>(state.results[x.id]?.correct||0));if(!w.length){alert("目前沒有待加強單字");return}startQuiz(w)};$("#export").onclick=()=>{const blob=new Blob([JSON.stringify({unit:UNIT,progress:state},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="TOEIC-reading-progress.json";a.click();URL.revokeObjectURL(a.href)};return}
if(mode==="cards"){const w=words[idx];shell("第一輪記憶卡",'<p class="muted">'+(idx+1)+' / '+words.length+'</p><div class="progress"><span style="width:'+(idx+1)/words.length*100+'%"></span></div><div class="panel"><div class="cardword">'+escape(w.en)+'</div>'+(show?'<div class="meaning">'+escape(w.zh)+'</div>':'<p class="muted" style="text-align:center">先在心裡回想中文意思</p>')+'<div class="actions" style="justify-content:center">'+(show?'<button id="no" class="outline">還沒記住</button><button id="yes">記住了</button>':'<button id="flip">翻牌看答案</button>')+'</div></div><button id="back" class="secondary">返回單元</button>');$("#back").onclick=()=>{mode="home";render()};if(!show)$("#flip").onclick=()=>{show=true;render()};else for(const [id,ok] of [["yes",true],["no",false]])$("#"+id).onclick=()=>{record(w.id,ok);idx=(idx+1)%words.length;show=false;render()};return}
if(mode==="quiz"){if(finished){const good=session.filter(x=>x.ok).length;shell("測驗完成",'<div class="panel"><h2>答對 '+good+' / '+session.length+' 題</h2><p class="muted">正確率 '+Math.round(100*good/session.length)+'%</p><div class="actions"><button id="again">再測一次</button><button id="home" class="secondary">返回首頁</button></div></div>');$("#again").onclick=()=>startQuiz(quiz.map(q=>q.word));$("#home").onclick=()=>{mode="home";render()};return}const q=quiz[qi];shell("單元小測驗",'<p class="muted">第 '+(qi+1)+' / '+quiz.length+' 題</p><div class="progress"><span style="width:'+qi/quiz.length*100+'%"></span></div><div class="panel"><p class="muted">請選出最適合的中文意思</p><div class="cardword">'+escape(q.word.en)+'</div><div class="choices">'+q.opts.map((o,i)=>'<button data-choice="'+i+'" class="'+(selected===i?(i===q.answer?"correct":"wrong"):"")+'">'+String.fromCharCode(65+i)+'. '+escape(o)+'</button>').join("")+'</div>'+(selected!==null?'<p>'+ (selected===q.answer?"答對了！":"正確答案："+escape(q.word.zh))+'</p><button id="next">'+(qi+1===quiz.length?"查看結果":"下一題")+'</button>':'')+'</div><button id="back" class="secondary">返回首頁</button>');$("#back").onclick=()=>{mode="home";render()};document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{if(selected!==null)return;selected=Number(b.dataset.choice);const ok=selected===q.answer;record(q.word.id,ok);session.push({id:q.word.id,ok});render()});if(selected!==null)$("#next").onclick=()=>{qi++;selected=null;if(qi===quiz.length){finished=true;state.sessions.push({unit:UNIT.id,date:new Date().toISOString(),correct:session.filter(x=>x.ok).length,total:session.length});save();sync()}render()};}}
function startQuiz(list){const pool=[...list].sort(()=>Math.random()-.5).slice(0,Math.min(10,list.length));quiz=pool.map(w=>{const opts=[w.zh,...words.filter(x=>x.id!==w.id&&x.zh!==w.zh).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.zh)].sort(()=>Math.random()-.5);return{word:w,opts,answer:opts.indexOf(w.zh)}});qi=0;selected=null;finished=false;session=[];mode="quiz";render()}
render();initAuth();
</script></body></html>
